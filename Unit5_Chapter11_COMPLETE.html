const frame=document.getElementById('game');
function openActivity(slug){
  if(!Object.prototype.hasOwnProperty.call(PAYLOADS,slug))return;
  const bytes=Uint8Array.from(atob(PAYLOADS[slug]),c=>c.charCodeAt(0));
  frame.srcdoc=new TextDecoder('utf-8').decode(bytes);
  frame.title='Chapter 11 — '+TITLES[slug];
  document.getElementById('activity-heading').textContent=TITLES[slug];
  document.querySelectorAll('button.activity').forEach(b=>{const selected=b.dataset.activity===slug;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
}
document.querySelectorAll('button.activity').forEach(b=>b.addEventListener('click',()=>openActivity(b.dataset.activity)));
